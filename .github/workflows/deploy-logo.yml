name: Deploy approved JOLI logo
on:
  push:
    paths:
      - '.github/workflows/deploy-logo.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write approved logo
        shell: bash
        run: |
          printf '%s' '' | base64 -d > joli-approved-logo.webp
      - name: Commit logo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add joli-approved-logo.webp
          git commit -m 'Add approved JOLI logo asset' || exit 0
          git push
